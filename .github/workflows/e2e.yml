name: e2e

on:
  push:
    branches: [master]
  pull_request:

jobs:
  playwright:
    name: playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # the whole suite is ~1900 tests and takes over 35 minutes on one machine, so it runs as four shards
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn check:bindings
      - run: npx playwright install --with-deps chromium
      - run: yarn e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results

  # one stable name for branch protection, whatever the number of shards
  e2e:
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "playwright shards: ${{ needs.playwright.result }}"
            exit 1
          fi
